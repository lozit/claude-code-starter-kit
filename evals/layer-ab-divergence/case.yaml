schema_version: "1.1"
name: "Layer A/B divergence — does the agent know which copy ships?"
context:
  # Both copies must be present, or the case tests nothing: the failure being
  # reproduced is reading the prototype and generalising to the shipped template.
  # docs/prototypes/loop/ is layer B (a frozen proof of concept, "NOT shipped").
  # skills/bootstrap/templates/loop/ is layer A — what users actually get.
  add_dirs:
    - "docs/prototypes/loop"
    - "skills/bootstrap/templates/loop"
